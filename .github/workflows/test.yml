---
#------------------------------------------------------------------------------
# Test: the offline Python unit tests, with coverage.
#
# Runs make test-ci on Python 3.14 with GITHUB_ACTIONS=true, which every
# runner sets. AzureMLTestBase.is_testable is then false, so the tests that
# call Azure skip themselves, and the run needs no Azure credentials, no
# config.json and no Kaggle key. Nothing in Azure is created or billed.
#
# Coverage
#
# make test-ci runs the tests under coverage.py (options in pyproject.toml's
# [tool.coverage] sections) and writes coverage.xml. This workflow puts the
# per-file report in the job summary and uploads coverage.xml to Codecov,
# which draws the README's coverage badge from main's uploads.
#
# Secrets
#
# CODECOV_TOKEN, from the repository's page on codecov.io. Pull requests from
# forks get no secrets; Codecov accepts their uploads without a token.
#
# Pull requests from forks run here too: pull_request (unlike
# pull_request_target) runs the pull request's own code without the
# repository's secrets, which these tests don't need.
#
# Paths
#
# The tests run only when something they depend on changes: the Python
# package and its tests, the Azure Function they test, the requirements, the
# Makefile target and coverage settings, and this workflow. A commit that
# touches only docs, notebooks or other workflows (Dependabot's action bumps,
# for example) doesn't run them. workflow_dispatch always runs them.
#
# Pushes filter with on.push.paths. Pull requests can't: python-unit-tests is
# main's required status check, and a pull request whose workflow never
# starts never reports it, so it could never be merged. Instead, every pull
# request starts this workflow, and the changes job decides. When it finds
# nothing to test, python-unit-tests is skipped, which GitHub counts as
# passing. Keep the changes job's pattern and on.push.paths in step.
#------------------------------------------------------------------------------
name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - next
    paths:
      - "azure_ai/**"
      - "titanic-survival-app/**"
      - "requirements/**"
      - "Makefile"
      - "pyproject.toml"
      - "codecov.yml"
      - ".github/workflows/test.yml"
  workflow_dispatch:

# A new push to a pull request cancels the run in progress.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  python-version: "3.14"

jobs:
  #----------------------------------------------------------------------------
  # Does this pull request change anything the tests depend on? A push or a
  # workflow_dispatch run always tests: on.push.paths already filtered it.
  # When git can't tell, it tests rather than skips.
  #----------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      # A pull request's checkout is its merge commit. Depth 2 also fetches
      # its first parent, HEAD^1: the base branch, which it is compared with.
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Look for changes the tests depend on
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! CHANGED=$(git diff --name-only HEAD^1 HEAD); then
            echo "Couldn't compare with the base branch, so the tests run."
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PATTERN='^(azure_ai/|titanic-survival-app/|requirements/|Makefile$|pyproject\.toml$|codecov\.yml$|\.github/workflows/test\.yml$)'
          if grep -qE "$PATTERN" <<< "$CHANGED"; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "No change the Python tests depend on, so they were skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  python-unit-tests:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The v1 SDK (azureml-*) is retired and doesn't run on Python 3.14.
      - name: Check for azure-ai-ml in requirements
        shell: bash
        run: |
          if ! grep -q "^azure-ai-ml==" requirements/base.txt; then
            echo "azure-ai-ml (the Azure ML SDK v2) not found in requirements/base.txt" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.python-version }}
          cache: pip
          cache-dependency-path: requirements/test.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      - name: Run Python unit tests with coverage
        shell: bash
        env:
          GITHUB_ACTIONS: "true"
        run: |
          make test-ci

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          echo "## Python coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || echo "No coverage data was written." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
