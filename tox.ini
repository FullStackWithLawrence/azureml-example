#------------------------------------------------------------------------------
# tox: run azureml-example's unit tests and Python linters in isolated virtual
# environments.
#
#   tox            # unit tests, flake8 and pylint
#   tox -e flake8  # one of them
#
# The pre-commit hooks (.pre-commit-config.yaml) are the lint standard; these
# environments run the same flake8 configuration (.flake8), and pylint
# (.pylintrc) as `make python-lint` does. The unit tests run without Azure
# credentials, as they do in CI (GITHUB_ACTIONS=true).
#------------------------------------------------------------------------------
[tox]
envlist = py314,flake8,pylint
skip_missing_interpreters = true

[testenv]
skip_install = true
deps = -rrequirements/prod.txt
setenv =
    GITHUB_ACTIONS = true
commands = python -m unittest discover -s azure_ai/

[testenv:flake8]
skip_install = true
deps = flake8
commands = flake8 azure_ai

[testenv:pylint]
skip_install = true
deps = -rrequirements/local.txt
commands = pylint azure_ai
