---
#------------------------------------------------------------------------------
# Lawrence McDaniel - https://lawrencemcdaniel.com
# Version Bump Workflow for .pre-commit-config.yaml
#
# This workflow runs on a cron schedule and checks for updates to the
# .pre-commit-config.yaml file. If updates are found, the workflow
# commits the changes to the alpha branch and pushes the changes to GitHub.
#
# This is a workaround for the fact that the pre-commit autoupdate command
# is not supported by Dependabot.
#------------------------------------------------------------------------------
name: pre-commit Version Bumps

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

# The push to alpha uses the PAT secret, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  evaluate_precommit_config:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: alpha
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # pre-commit autoupdate only reads the hooks' repositories, so it needs
      # pre-commit itself, at the version requirements/local.txt pins.
      - name: Install pre-commit
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -E '^pre-commit==' requirements/local.txt)"

      - name: Update .pre-commit-config.yaml
        run: |
          pre-commit autoupdate

      - name: Check for unstaged changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain .pre-commit-config.yaml)" ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .pre-commit-config.yaml
          # No CI skip tag: this commit can become the head of the pull
          # request from alpha to main, whose Tests would then never start.
          git commit -m "chore: [gh] version bumps in .pre-commit-config.yaml"
          git push https://${{ secrets.PAT }}@github.com/${{ github.repository }}.git HEAD:alpha
