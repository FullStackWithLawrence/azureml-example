---
#------------------------------------------------------------------------------
# Lawrence McDaniel - https://lawrencemcdaniel.com
# Semantic Version Bump: azure_ai/__version__.py on alpha and beta.
#
# Calculates the branch's next version with a semantic-release dry run, and
# compares it with azure_ai/__version__.py. When they differ, it rewrites
# __version__.py and pushes the change to the branch that started the run.
#
# The commit carries no CI skip tag: it is often the head of the pull request
# from alpha to main, whose Tests would then never start (see
# release.config.js). Its own push starts this workflow again, which finds the
# versions equal and stops.
#------------------------------------------------------------------------------
name: Semantic Version Bump

on:
  workflow_dispatch:
  push:
    branches:
      - alpha
      - beta

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

# The push uses the PAT secret, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  bump-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION_FILE: azure_ai/__version__.py

    steps:
      # Full history, so that semantic-release finds the last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - name: Install npm dependencies
        run: npm install

      # The version in azure_ai/__version__.py now.
      - name: Get current version
        id: current_version
        shell: bash
        run: |
          echo "version=$(python -c 'from azure_ai.__version__ import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      # The version semantic-release would release from this branch. It prints
      # nothing when the commits call for no release, so fall back to the
      # current version.
      - name: Get next version
        id: next_version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
        run: |
          NEXT_VERSION=$(npx semantic-release --dry-run --no-ci | awk '/The next release version is/{print $NF}')
          echo "version=${NEXT_VERSION:-$CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Summary
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
          NEXT_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          echo "Current version: $CURRENT_VERSION. Next version: $NEXT_VERSION." >> "$GITHUB_STEP_SUMMARY"

      - name: Update __version__.py
        if: steps.current_version.outputs.version != steps.next_version.outputs.version
        shell: bash
        env:
          NEXT_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          {
            echo "# -*- coding: utf-8 -*-"
            echo "# DO NOT EDIT."
            echo "# Managed via automated CI/CD in .github/workflows/semanticVersionBump.yml."
            echo "__version__ = \"$NEXT_VERSION\""
          } > "$VERSION_FILE"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "$VERSION_FILE"
          git commit -m "chore: [gh] Update __version__.py to $NEXT_VERSION"
          git push https://${{ secrets.PAT }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
