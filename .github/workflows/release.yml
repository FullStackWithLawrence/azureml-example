---
#------------------------------------------------------------------------------
# Release: semantic-release, on every push to main.
#
# Reads the conventional commits since the last tag and, when they call for a
# release (see release.config.js: docs, test, style and refactor commits
# don't), publishes it: the version, CHANGELOG.md, the tag and the GitHub
# release. It then pushes the release to its major version's branch (v1, v2,
# ...), so that anyone can follow a major version.
#
# release.config.js is the one place that lists the release branches and
# plugins. Prerelease versions for alpha and beta are written to
# azure_ai/__version__.py by semanticVersionBump.yml instead.
#
# The PAT secret, rather than GITHUB_TOKEN, lets semantic-release push its
# commit and tag past main's branch protection. Its commit,
# chore(release): <version>, starts this workflow again; the job skips it.
#------------------------------------------------------------------------------
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One release at a time. A merge while a release runs waits for it, and the
# next run releases everything since the last tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# GITHUB_TOKEN is read-only. Every write uses the PAT secret instead.
permissions:
  contents: read

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0

      - name: Install npm dependencies
        run: npm install

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        id: semantic
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

      - name: Summary
        shell: bash
        run: |
          if [[ "${{ steps.semantic.outputs.new_release_published }}" == "true" ]]; then
            echo "Released ${{ steps.semantic.outputs.new_release_git_tag }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: the commits since the last tag don't call for one." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push the release to its major version's branch
        if: steps.semantic.outputs.new_release_published == 'true'
        shell: bash
        run: |
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/v${{ steps.semantic.outputs.new_release_major_version }}"
